openapi: 3.0.3
info:
  title: PEP API — Clínica-Escola de Psicologia
  description: Prontuário Eletrônico do Paciente. Contrato gerado a partir das
    rotas (schema-first).
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      summary: Liveness probe
      tags:
        - health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /ready:
    get:
      summary: Readiness probe (checa banco de dados)
      tags:
        - health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  code:
                    type: string
  /version:
    get:
      summary: Build version
      tags:
        - health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                properties:
                  version:
                    type: string
  /api/auth/login:
    post:
      summary: Autentica e inicia sessão
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - user
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - fullName
                      - role
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      fullName:
                        type: string
                      role:
                        type: string
                        enum:
                          - PATIENT
                          - INTERN
                          - SUPERVISOR
                          - ADMIN
                      profileComplete:
                        type: boolean
  /api/auth/intern-login:
    post:
      summary: Login do estagiário via TOTVS RM (usuário/senha institucionais)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuarioRm
                - senhaRm
              additionalProperties: false
              properties:
                usuarioRm:
                  type: string
                  pattern: ^\d{11}$
                senhaRm:
                  type: string
                  minLength: 1
                  maxLength: 128
                linkEmail:
                  type: string
                  format: email
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - user
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - fullName
                      - role
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      fullName:
                        type: string
                      role:
                        type: string
                        enum:
                          - PATIENT
                          - INTERN
                          - SUPERVISOR
                          - ADMIN
                      profileComplete:
                        type: boolean
  /api/auth/patient-login:
    post:
      summary: Login do paciente por CPF + data de nascimento (sem senha)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cpf
                - birthDate
              additionalProperties: false
              properties:
                cpf:
                  type: string
                birthDate:
                  type: string
                  format: date
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - user
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - fullName
                      - role
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      fullName:
                        type: string
                      role:
                        type: string
                        enum:
                          - PATIENT
                          - INTERN
                          - SUPERVISOR
                          - ADMIN
                      profileComplete:
                        type: boolean
  /api/auth/refresh:
    post:
      summary: Renova o access token (rotaciona o refresh)
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                properties:
                  accessToken:
                    type: string
  /api/auth/logout:
    post:
      summary: Encerra a sessão
      tags:
        - auth
      responses:
        "204":
          description: Default Response
  /api/auth/me:
    get:
      summary: Dados do usuário autenticado
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - fullName
                  - role
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  fullName:
                    type: string
                  role:
                    type: string
                    enum:
                      - PATIENT
                      - INTERN
                      - SUPERVISOR
                      - ADMIN
                  profileComplete:
                    type: boolean
  /api/users:
    post:
      summary: Cadastra aluno/estagiário ou supervisor (Administrativo)
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - fullName
                - email
                - password
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum:
                    - INTERN
                    - SUPERVISOR
                    - ADMIN
                fullName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                crp:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{2}/\d{4,6}$
                ra:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{6}$
                phone:
                  type:
                    - string
                    - "null"
                  pattern: ^\(\d{2}\) \d{4,5}-\d{4}$
                department:
                  type:
                    - string
                    - "null"
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - fullName
                  - email
                  - role
                properties:
                  id:
                    type: string
                    format: uuid
                  fullName:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - PATIENT
                      - INTERN
                      - SUPERVISOR
                      - ADMIN
                  crp:
                    type:
                      - "null"
                      - string
                  ra:
                    type:
                      - "null"
                      - string
                  phone:
                    type:
                      - "null"
                      - string
                  department:
                    type:
                      - "null"
                      - string
                  active:
                    type: boolean
    get:
      summary: Lista usuários por papel (seletores de coautor/agendamento)
      tags:
        - users
      parameters:
        - schema:
            type: string
            enum:
              - PATIENT
              - INTERN
              - SUPERVISOR
              - ADMIN
          in: query
          name: role
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - fullName
                    - email
                    - role
                  properties:
                    id:
                      type: string
                      format: uuid
                    fullName:
                      type: string
                    email:
                      type: string
                    role:
                      type: string
                      enum:
                        - PATIENT
                        - INTERN
                        - SUPERVISOR
                        - ADMIN
                    crp:
                      type:
                        - "null"
                        - string
                    ra:
                      type:
                        - "null"
                        - string
                    phone:
                      type:
                        - "null"
                        - string
                    department:
                      type:
                        - "null"
                        - string
                    active:
                      type: boolean
  /api/users/pending-supervisors:
    get:
      summary: Lista estagiários com supervisor pendente (opção "Outro" no autocadastro)
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    fullName:
                      type: string
                    email:
                      type: string
                    pendingSupervisorName:
                      type: string
  /api/users/{id}/link-supervisor:
    patch:
      summary: Vincula um estagiário pendente a um supervisor cadastrado
        (Administrativo)
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supervisorId
              additionalProperties: false
              properties:
                supervisorId:
                  type: string
                  format: uuid
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
  /api/appointments:
    post:
      summary: Agenda uma sessão (Administrativo)
      tags:
        - appointments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - internId
                - scheduledAt
              additionalProperties: false
              properties:
                patientId:
                  type: string
                  format: uuid
                internId:
                  type: string
                  format: uuid
                scheduledAt:
                  type: string
                  format: date-time
                notes:
                  type:
                    - string
                    - "null"
                  maxLength: 2000
                roomId:
                  type:
                    - string
                    - "null"
                  format: uuid
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - patientId
                  - internId
                  - scheduledAt
                  - status
                properties:
                  id:
                    type: string
                    format: uuid
                  patientId:
                    type: string
                    format: uuid
                  internId:
                    type: string
                    format: uuid
                  scheduledAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                      - SCHEDULED
                      - ATTENDED
                      - NO_SHOW
                      - CANCELLED
                  notes:
                    type:
                      - "null"
                      - string
                  roomId:
                    type:
                      - "null"
                      - string
                    format: uuid
                  roomName:
                    type:
                      - "null"
                      - string
    get:
      summary: Lista a agenda visível ao usuário (escopo por papel/vínculo via RLS)
      tags:
        - appointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - patientId
                    - internId
                    - scheduledAt
                    - status
                  properties:
                    id:
                      type: string
                      format: uuid
                    patientId:
                      type: string
                      format: uuid
                    internId:
                      type: string
                      format: uuid
                    scheduledAt:
                      type: string
                      format: date-time
                    status:
                      type: string
                      enum:
                        - SCHEDULED
                        - ATTENDED
                        - NO_SHOW
                        - CANCELLED
                    notes:
                      type:
                        - "null"
                        - string
                    roomId:
                      type:
                        - "null"
                        - string
                      format: uuid
                    roomName:
                      type:
                        - "null"
                        - string
  /api/appointments/{id}/attendance:
    patch:
      summary: Registra presença/falta de uma sessão
      tags:
        - appointments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - outcome
              additionalProperties: false
              properties:
                outcome:
                  type: string
                  enum:
                    - ATTENDED
                    - NO_SHOW
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - patientId
                  - internId
                  - scheduledAt
                  - status
                properties:
                  id:
                    type: string
                    format: uuid
                  patientId:
                    type: string
                    format: uuid
                  internId:
                    type: string
                    format: uuid
                  scheduledAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                      - SCHEDULED
                      - ATTENDED
                      - NO_SHOW
                      - CANCELLED
                  notes:
                    type:
                      - "null"
                      - string
                  roomId:
                    type:
                      - "null"
                      - string
                    format: uuid
                  roomName:
                    type:
                      - "null"
                      - string
  /api/screenings:
    post:
      summary: Cria uma triagem (rascunho) — Estagiário
      tags:
        - screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - patientId
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                    - SCREENING_ADULT
                    - SCREENING_CHILD
                patientId:
                  type: string
                  format: uuid
                coAuthorIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                content:
                  type: object
                  additionalProperties: true
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - type
                  - status
                  - version
                  - patientId
                  - authorId
                  - content
                properties:
                  id:
                    type: string
                    format: uuid
                  numero:
                    type:
                      - "null"
                      - string
                  type:
                    type: string
                    enum:
                      - SCREENING_ADULT
                      - SCREENING_CHILD
                  status:
                    type: string
                  version:
                    type: integer
                  patientId:
                    type: string
                    format: uuid
                  authorId:
                    type: string
                    format: uuid
                  coAuthorIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  content:
                    type: object
                    additionalProperties: true
                  signatures:
                    type: array
                    items:
                      type: object
                      properties:
                        signerName:
                          type: string
                        signerRole:
                          type: string
                        signerRef:
                          type:
                            - "null"
                            - string
                        provider:
                          type: string
                        signedAt:
                          type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
    get:
      summary: Lista triagens visíveis (escopo por RLS)
      tags:
        - screening
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - type
                    - status
                    - version
                    - patientId
                    - authorId
                    - content
                  properties:
                    id:
                      type: string
                      format: uuid
                    numero:
                      type:
                        - "null"
                        - string
                    type:
                      type: string
                      enum:
                        - SCREENING_ADULT
                        - SCREENING_CHILD
                    status:
                      type: string
                    version:
                      type: integer
                    patientId:
                      type: string
                      format: uuid
                    authorId:
                      type: string
                      format: uuid
                    coAuthorIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                    content:
                      type: object
                      additionalProperties: true
                    signatures:
                      type: array
                      items:
                        type: object
                        properties:
                          signerName:
                            type: string
                          signerRole:
                            type: string
                          signerRef:
                            type:
                              - "null"
                              - string
                          provider:
                            type: string
                          signedAt:
                            type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
  /api/screenings/{id}:
    get:
      summary: Obtém uma triagem (leitura auditada)
      tags:
        - screening
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - type
                  - status
                  - version
                  - patientId
                  - authorId
                  - content
                properties:
                  id:
                    type: string
                    format: uuid
                  numero:
                    type:
                      - "null"
                      - string
                  type:
                    type: string
                    enum:
                      - SCREENING_ADULT
                      - SCREENING_CHILD
                  status:
                    type: string
                  version:
                    type: integer
                  patientId:
                    type: string
                    format: uuid
                  authorId:
                    type: string
                    format: uuid
                  coAuthorIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  content:
                    type: object
                    additionalProperties: true
                  signatures:
                    type: array
                    items:
                      type: object
                      properties:
                        signerName:
                          type: string
                        signerRole:
                          type: string
                        signerRef:
                          type:
                            - "null"
                            - string
                        provider:
                          type: string
                        signedAt:
                          type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
    patch:
      summary: Salva o rascunho da triagem (auto-save) — Estagiário
      tags:
        - screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - expectedVersion
              additionalProperties: false
              properties:
                content:
                  type: object
                  additionalProperties: true
                expectedVersion:
                  type: integer
                  minimum: 1
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - type
                  - status
                  - version
                  - patientId
                  - authorId
                  - content
                properties:
                  id:
                    type: string
                    format: uuid
                  numero:
                    type:
                      - "null"
                      - string
                  type:
                    type: string
                    enum:
                      - SCREENING_ADULT
                      - SCREENING_CHILD
                  status:
                    type: string
                  version:
                    type: integer
                  patientId:
                    type: string
                    format: uuid
                  authorId:
                    type: string
                    format: uuid
                  coAuthorIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  content:
                    type: object
                    additionalProperties: true
                  signatures:
                    type: array
                    items:
                      type: object
                      properties:
                        signerName:
                          type: string
                        signerRole:
                          type: string
                        signerRef:
                          type:
                            - "null"
                            - string
                        provider:
                          type: string
                        signedAt:
                          type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
    delete:
      summary: Remove um documento — só RASCUNHO próprio/coautoria (ADMIN remove
        qualquer status)
      tags:
        - screening
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
  /api/patients:
    get:
      summary: Lista pacientes vinculados ao usuário (nome descriptografado)
      tags:
        - patients
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - code
                    - fullName
                    - hasDisability
                    - disabilities
                  properties:
                    id:
                      type: string
                      format: uuid
                    code:
                      type: string
                    fullName:
                      type: string
                    birthDate:
                      type:
                        - "null"
                        - string
                    isMinor:
                      type: boolean
                    hasDisability:
                      type: boolean
                    disabilities:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - FISICA
                              - VISUAL
                              - AUDITIVA
                              - INTELECTUAL
                              - PSICOSSOCIAL
                              - MULTIPLA
                              - OUTRA
                          otherText:
                            type:
                              - "null"
                              - string
    post:
      summary: Cadastra um paciente (Administrativo). Responsável obrigatório se menor.
      tags:
        - patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
              additionalProperties: false
              properties:
                fullName:
                  type: string
                  minLength: 2
                cpf:
                  type:
                    - string
                    - "null"
                  pattern: ^\d{3}\.\d{3}\.\d{3}-\d{2}$
                birthDate:
                  type:
                    - string
                    - "null"
                  format: date
                phone:
                  type:
                    - string
                    - "null"
                  pattern: ^\(\d{2}\) \d{4,5}-\d{4}$
                guardian:
                  type:
                    - object
                    - "null"
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    cpf:
                      type:
                        - string
                        - "null"
                      pattern: ^\d{3}\.\d{3}\.\d{3}-\d{2}$
                    relationship:
                      type:
                        - string
                        - "null"
                    phone:
                      type:
                        - string
                        - "null"
                      pattern: ^\(\d{2}\) \d{4,5}-\d{4}$
                hasDisability:
                  type: boolean
                  default: false
                disabilityTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - FISICA
                      - VISUAL
                      - AUDITIVA
                      - INTELECTUAL
                      - PSICOSSOCIAL
                      - MULTIPLA
                      - OUTRA
                disabilityOtherText:
                  type:
                    - string
                    - "null"
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - code
