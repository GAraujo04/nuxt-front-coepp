  /api/register/patient:
    post:
      summary: Autocadastro público de paciente (dados + login + disponibilidade)
      tags:
        - enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - cpf
                - birthDate
                - windows
              additionalProperties: false
              properties:
                fullName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                cpf:
                  type: string
                  pattern: ^\d{3}\.\d{3}\.\d{3}-\d{2}$
                birthDate:
                  type: string
                  format: date
                phone:
                  type:
                    - string
                    - "null"
                  pattern: ^\(\d{2}\) \d{4,5}-\d{4}$
                guardian:
                  type:
                    - object
                    - "null"
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    cpf:
                      type:
                        - string
                        - "null"
                      pattern: ^\d{3}\.\d{3}\.\d{3}-\d{2}$
                    relationship:
                      type:
                        - string
                        - "null"
                    phone:
                      type:
                        - string
                        - "null"
                      pattern: ^\(\d{2}\) \d{4,5}-\d{4}$
                windows:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - weekday
                      - startTime
                      - endTime
                    additionalProperties: false
                    properties:
                      weekday:
                        type: integer
                        minimum: 0
                        maximum: 6
                      startTime:
                        type: string
                        pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                      endTime:
                        type: string
                        pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                hasDisability:
                  type: boolean
                  default: false
                disabilityTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - FISICA
                      - VISUAL
                      - AUDITIVA
                      - INTELECTUAL
                      - PSICOSSOCIAL
                      - MULTIPLA
                      - OUTRA
                disabilityOtherText:
                  type:
                    - string
                    - "null"
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - code
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
